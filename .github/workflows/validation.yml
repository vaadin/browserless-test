name: Browserless Test Validation

on:
  pull_request:
    # Maintenance branches are named <major>.<minor>, e.g. 25.3 or 1.1
    branches:
      - main
      - "[0-9]+.[0-9]+"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  HEAD_REF: ${{ github.head_ref }}
  REF_NAME: ${{ github.ref_name }}
  BASE_REF: ${{ github.event.pull_request.base.ref }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_NUMBER: ${{ github.event.number }}
  JAVA_VERSION: 21
  VAADIN_PRO_KEY: ${{ secrets.VAADIN_PRO_KEY }}

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Applies the formatting rather than only checking it, so that the
      # changes can be suggested on the pull request by
      # formatter-suggestions.yml
      - name: Run spotless
        id: spotless
        run: |
          mvn spotless:apply --batch-mode --no-transfer-progress
          # Written even when empty, so that formatter-suggestions.yml can
          # remove the comment of an earlier run once the format is fixed
          git diff > formatter-diff.txt
          git diff --name-only
          echo "modified=$(git diff --name-only | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload formatter diff
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: formatter-diff
          path: formatter-diff.txt
          retention-days: 30

      - name: Fail if formatting issues exist
        if: steps.spotless.outputs.modified != '0'
        run: |
          echo "::error::There are ${{ steps.spotless.outputs.modified }} files with format errors"
          exit 1

  build:
    name: Build Project
    needs: format-check
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Clean Maven cache (if needed)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "---> Clean maven cache"
          rm -rf ~/.m2/repository

      - name: Build with Maven and Generate Javadoc
        run: |
          set -o pipefail
          mvn clean install -DskipTests -Djavadocs -B -ntp 2>&1 | tee mvn-build.out

      - name: Convert Javadoc problems to JUnit XML
        if: failure()
        run: |
          python3 .github/scripts/javadocErrorsToJUnit.py \
            mvn-build.out javadoc-reports/TEST-Javadoc.xml

      - name: Upload Javadoc results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: javadoc-results
          path: javadoc-reports/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

  unit-tests:
    name: Unit Tests
    needs: build
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Restore Maven cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}

      - name: Run unit tests
        run: mvn test -B -ntp

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            **/target/surefire-reports/TEST-*.xml
          retention-days: 7

  test-results:
    name: Test Results
    permissions:
      contents: read
      pull-requests: write
    # Runs whether the tests passed or failed, and when the build failed so
    # that Javadoc problems are published, but not for fork PRs — their token
    # cannot comment on the PR and unit-tests is skipped for them.
    if: ${{ always() && !github.event.pull_request.head.repo.fork && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'failure' || needs.build.result == 'failure') }}
    needs: [build, unit-tests]
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: '*-results'

      # check_run is disabled on purpose: a check run created through the Checks
      # API is attached to the oldest check suite for the head SHA, which for
      # fork-validation PRs belongs to the earlier fork run, so the results would
      # show up under that run instead of this one. This job is itself named
      # "Test Results", so the run and the PR check list both stay correct, and
      # the tables are written to this job's summary.
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/TEST-*.xml'
          check_name: Test Results
          check_run: false
          job_summary: true
          comment_mode: failures

  validation-status:
    name: Validation Status
    if: ${{ always() && !github.event.pull_request.head.repo.fork }}
    needs: [format-check, build, unit-tests]
    runs-on: ubuntu-26.04

    steps:
      - name: Check all jobs status
        run: |
          echo "format-check: ${{ needs.format-check.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"

          if [ "${{ needs.format-check.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "One or more validation jobs failed"
            exit 1
          fi
          echo "All validation jobs completed successfully"
